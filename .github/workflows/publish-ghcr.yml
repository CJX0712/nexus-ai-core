name: publish-ghcr

# 多服务仓库：逐个服务构建多架构镜像并推送到 GitHub Container Registry (ghcr.io)，
# 推完各自跑一次冒烟。镜像名规则: ghcr.io/cjx0712/<repo>-<service>
#
# v2: QEMU + linux/amd64 + linux/arm64, semver tags, GHA layer cache,
#     guaranteed smoke-test cleanup.
#
# Author: 晨星

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, push, run (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, context: "./backend", dockerfile: ./backend/Dockerfile, buildargs: ""}
          - {name: frontend, context: "./frontend", dockerfile: ./frontend/Dockerfile, buildargs: ""}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cjx0712/nexus-ai-core-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.buildargs }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

      - name: Smoke test - run the published image
        continue-on-error: true
        run: |
          docker run -d --name smoke ghcr.io/cjx0712/nexus-ai-core-${{ matrix.name }}:latest || true
          sleep 15
          echo "----- docker ps -----"; docker ps -a || true
          echo "----- container logs -----"; docker logs smoke 2>&1 | tail -30 || true

      - name: Cleanup smoke container
        if: always()
        continue-on-error: true
        run: docker rm -f smoke || true

      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "users/cjx0712/packages/container/nexus-ai-core-${{ matrix.name }}/visibility" -f visibility=public \
            && echo "package is public" || echo "visibility patch failed"

